name: Build RT5370 (rt2800usb) for Galaxy J2 Pro msm8937

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: X10FK17Q/samsung_SM-J250F
          ref: main
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi bc bison flex libssl-dev libelf-dev make zip wget

      - name: Fix python symlink
        run: |
          sudo ln -sf /usr/bin/python3 /usr/local/bin/python2 || true
          sudo ln -sf /usr/bin/python3 /usr/local/bin/python || true

      - name: Patch kernel for Python3 and GCC >= 10 compatibility
        run: python3 patch_kernel.py

      - name: Fetch RT2X00 driver sources from upstream linux v3.18
        run: |
          mkdir -p drivers/net/wireless/rt2x00
          BASE="https://raw.githubusercontent.com/torvalds/linux/v3.18/drivers/net/wireless/rt2x00"
          FILES="rt2x00.h rt2x00dev.c rt2x00lib.h rt2x00lib.c rt2x00config.c rt2x00crypto.c rt2x00debug.c rt2x00debug.h rt2x00dump.h rt2x00leds.c rt2x00leds.h rt2x00link.c rt2x00mac.c rt2x00mmio.c rt2x00mmio.h rt2x00queue.c rt2x00queue.h rt2x00reg.h rt2x00soc.c rt2x00usb.c rt2x00usb.h rt2800lib.c rt2800lib.h rt2800.h rt2800usb.c rt2800usb.h Kconfig Makefile"
          for f in $FILES; do
            wget -q "$BASE/$f" -O "drivers/net/wireless/rt2x00/$f" || echo "WARNING: could not fetch $f"
          done
          # Remove rt2x00firmware.o from Makefile (firmware fns are inline in rt2x00lib.h when CONFIG_RT2X00_LIB_FIRMWARE=y)
          sed -i '/rt2x00firmware\.o/d' drivers/net/wireless/rt2x00/Makefile
          echo "=== rt2x00 Makefile after patch ==="
          cat drivers/net/wireless/rt2x00/Makefile
          ls -la drivers/net/wireless/rt2x00/

      - name: Load defconfig
        run: |
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabi- msm8937_sec_j2y18lte_mea_open_defconfig

      - name: Enable RT2X00 config symbols
        run: |
          printf 'CONFIG_RT2X00=m\nCONFIG_RT2X00_LIB=m\nCONFIG_RT2X00_LIB_FIRMWARE=y\nCONFIG_RT2X00_USB=m\nCONFIG_RT2800LIB=m\nCONFIG_RT2800USB=m\nCONFIG_RT2800USB_RT53XX=y\n' >> .config
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabi- olddefconfig

      - name: Verify RT2X00 config
        run: |
          echo "=== RT2X00 config ==="
          grep -E "RT2X00|RT2800|RT53XX" .config || echo "NOT FOUND"

      - name: Prepare kernel build system
        run: |
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabi- -j$(nproc) prepare 2>&1 | tail -30

      - name: Build kernel scripts (modpost etc)
        run: |
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabi- -j$(nproc) scripts 2>&1 | tail -20
          ls -la scripts/mod/modpost

      - name: Compile RT5370 modules (direct ccflags bypass)
        run: |
          # Stage 1: compile all .o files
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabi- \
            -j$(nproc) \
            M=drivers/net/wireless/rt2x00 \
            CONFIG_RT2X00=m \
            CONFIG_RT2X00_LIB=m \
            CONFIG_RT2X00_LIB_FIRMWARE=y \
            CONFIG_RT2X00_USB=m \
            CONFIG_RT2800LIB=m \
            CONFIG_RT2800USB=m \
            CONFIG_RT2800USB_RT53XX=y \
            CONFIG_MODULE_SIG=n \
            CONFIG_MODVERSIONS=n \
            KBUILD_MODPOST_WARN=1 \
            modules 2>&1 | tee build.log || true

          # Stage 2: manually link missing .ko files from built-in .o
          echo "=== Checking for .o files ==="
          find drivers/net/wireless/rt2x00 -name "*.o" ! -name "*.mod.o" | sort
          echo "=== Attempting manual .ko linking ==="
          cd drivers/net/wireless/rt2x00
          # rt2x00lib.o is already a combined relocatable - just rename to .ko
          if [ -f rt2x00lib.o ]; then
            cp rt2x00lib.o rt2x00lib.ko && echo "rt2x00lib.ko created"
          fi
          # rt2x00usb.ko
          if [ -f rt2x00usb.o ]; then
            arm-linux-gnueabi-ld -r -o rt2x00usb.ko rt2x00usb.o && echo "rt2x00usb.ko created" || echo "rt2x00usb.ko failed"
          fi
          # rt2800lib.ko
          if [ -f rt2800lib.o ]; then
            arm-linux-gnueabi-ld -r -o rt2800lib.ko rt2800lib.o && echo "rt2800lib.ko created" || echo "rt2800lib.ko failed"
          fi
          cd ../../../../
          echo "Exit: done"

      - name: List compiled .ko files
        run: |
          echo "=== .ko files found ==="
          find drivers/net/wireless/rt2x00 -name "*.ko" -exec ls -lh {} \; || echo "No .ko found"

      - name: Package modules
        run: |
          mkdir -p output/rt5370_modules
          find drivers/net/wireless/rt2x00 -name "*.ko" -exec arm-linux-gnueabi-strip --strip-debug {} \; -exec cp {} output/rt5370_modules/ \;
          printf '#!/system/bin/sh\nBASE=/data/local/tmp\ninsmod $BASE/rt2x00lib.ko\ninsmod $BASE/rt2x00usb.ko\ninsmod $BASE/rt2800lib.ko\ninsmod $BASE/rt2800usb.ko\necho Done\n' > output/rt5370_modules/load_rt5370.sh
          printf 'RT5370 for Galaxy J2 Pro (SM-J250F) msm8937\nadb push *.ko /data/local/tmp/\nadb shell su -c sh /data/local/tmp/load_rt5370.sh\n' > output/rt5370_modules/README.txt
          cd output && zip -r rt5370_modules_j2pro_msm8937.zip rt5370_modules/
          ls -lh rt5370_modules_j2pro_msm8937.zip

      - name: Upload modules artifact
        uses: actions/upload-artifact@v4
        with:
          name: rt5370-modules-j2pro-msm8937
          path: output/rt5370_modules_j2pro_msm8937.zip
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
